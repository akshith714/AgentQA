spring.application.name=agentqa

# Secrets default to the local dev values and are overridden by environment
# variables in any real deployment.
spring.datasource.url=${AGENTQA_DB_URL:jdbc:postgresql://localhost:5433/agentqa}
spring.datasource.username=${AGENTQA_DB_USERNAME:agentqa}
spring.datasource.password=${AGENTQA_DB_PASSWORD:agentqa}

agentqa.webhook.secret=${AGENTQA_WEBHOOK_SECRET:dev-secret-123}
agentqa.gitlab.base-url=${AGENTQA_GITLAB_BASE_URL:https://gitlab.com}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
